<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Race Robber: escapa en moto tras robar el Banco Central. Juego cenital estilo GTA 1 con dificultad adaptativa por IA." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2312141a'/><circle cx='27' cy='66' r='15' fill='none' stroke='%23f4d03f' stroke-width='8'/><circle cx='73' cy='66' r='15' fill='none' stroke='%23f4d03f' stroke-width='8'/><path d='M27 66 L48 40 L66 40 L73 66' fill='none' stroke='%23ff4d4d' stroke-width='8' stroke-linejoin='round'/></svg>" />
    <title>Race Robber — Fuga en Moto</title>
  </head>
  <body>
    <div id="app">
      <div id="loader">
        <div class="loader-stage">
          <div class="loader-dust"><i></i><i></i><i></i></div>
          <svg class="tire" viewBox="-50 -50 100 100" aria-hidden="true">
            <circle r="46" class="tire-rubber" />
            <circle r="44" class="tire-tread" />
            <circle r="31" class="tire-wall" />
            <circle r="27" class="tire-rim" />
            <g class="tire-spokes"><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(0)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(72)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(144)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(216)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(288)" /></g>
            <circle r="9" class="tire-hub" />
            <g class="tire-lugs"><circle cx="0" cy="-11" r="2.6" transform="rotate(36)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(108)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(180)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(252)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(324)" /></g>
          </svg>
          <div class="loader-road"></div>
        </div>
        <div class="loader-text">Cargando motor de física…</div>
        <div class="loader-tip"></div>
      </div>

      <div id="storm-overlay"></div>
      <div id="damage-overlay"></div>
      <div id="flash-overlay"></div>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="hud-level">
            <div id="hud-level-name"></div>
            <div id="hud-objective"></div>
          </div>
          <div class="hud-timer">
            <div id="hud-timer-label">META</div>
            <div id="hud-timer">0 m</div>
            <div class="bar small"><div id="hud-progress-bar" class="fill"></div></div>
          </div>
          <div class="hud-score">
            <div id="hud-cash"></div>
            <div id="hud-score"></div>
            <div id="hud-wanted"></div>
          </div>
        </div>

        <div id="hud-ai" class="hud-ai hidden">
          <div class="hud-ai-title">EL ANALISTA</div>
          <div class="bar"><div id="hud-ai-bar" class="fill ai"></div></div>
          <div class="hud-ai-row"><span>Habilidad estimada</span><b id="hud-ai-skill">—</b></div>
          <div class="hud-ai-row"><span>Perfil</span><b id="hud-ai-tier">Calibrando…</b></div>
        </div>
        <div id="hud-storm" class="hidden"></div>

        <div id="hud-toasts"></div>
        <div id="hud-countdown" class="hidden"></div>
        <div id="hud-players"></div>
      </div>

      <div id="screen" class="screen hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

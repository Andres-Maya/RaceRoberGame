<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Race Robber: escapa en moto tras robar el Banco Central. Juego cenital estilo GTA 1 con dificultad adaptativa por IA." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2312141a'/><circle cx='27' cy='66' r='15' fill='none' stroke='%23f4d03f' stroke-width='8'/><circle cx='73' cy='66' r='15' fill='none' stroke='%23f4d03f' stroke-width='8'/><path d='M27 66 L48 40 L66 40 L73 66' fill='none' stroke='%23ff4d4d' stroke-width='8' stroke-linejoin='round'/></svg>" />
    <title>Race Robber — Fuga en Moto</title>
    <!-- Estilos de la pantalla de carga en línea: así se ve bien antes de que cargue el resto del CSS. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #12141a;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      #loader {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px;
        text-align: center;
        background:
          radial-gradient(ellipse at 50% 115%, rgba(255, 120, 40, 0.28), transparent 60%),
          linear-gradient(180deg, #1a1d27, #0c0d12);
        transition: opacity 0.25s;
      }

      #loader.fade {
        opacity: 0;
        pointer-events: none;
      }

      .loader-stage {
        position: relative;
        width: min(320px, 80vw);
        height: 150px;
        overflow: hidden;
      }

      .tire {
        position: absolute;
        left: 50%;
        bottom: 14px;
        width: 112px;
        height: 112px;
        margin-left: -56px;
        animation:
          tire-spin 0.55s linear infinite,
          tire-bounce 0.55s ease-in-out infinite alternate;
        filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.5));
      }

      .tire-rubber {
        fill: #191919;
      }

      .tire-tread {
        fill: none;
        stroke: #2f2f2f;
        stroke-width: 5;
        stroke-dasharray: 7 5.8;
      }

      .tire-wall {
        fill: #232323;
        stroke: #0d0d0d;
        stroke-width: 2;
      }

      .tire-rim {
        fill: #9aa3ad;
        stroke: #d7dde3;
        stroke-width: 2;
      }

      .tire-spokes rect {
        fill: #5d666f;
      }

      .tire-hub {
        fill: #f4d03f;
        stroke: #6b3a00;
        stroke-width: 2;
      }

      .tire-lugs circle {
        fill: #2a2a2a;
      }

      .loader-road {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8px;
        height: 6px;
        border-radius: 3px;
        background: repeating-linear-gradient(90deg, #f4d03f 0 26px, transparent 26px 46px), #2a2d36;
        background-size: 46px 100%;
        animation: road-scroll 0.42s linear infinite;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent);
      }

      .loader-dust i {
        position: absolute;
        bottom: 14px;
        left: calc(50% - 60px);
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: rgba(214, 196, 160, 0.45);
        animation: dust 0.9s ease-out infinite;
      }

      .loader-dust i:nth-child(2) {
        animation-delay: 0.3s;
      }

      .loader-dust i:nth-child(3) {
        animation-delay: 0.6s;
      }

      .loader-text {
        font: 1.4rem Impact, 'Arial Black', 'Franklin Gothic Bold', sans-serif;
        letter-spacing: 0.06em;
        color: #f4d03f;
      }

      .loader-text::after {
        content: '';
        animation: dots 1.2s steps(4) infinite;
      }

      .loader-tip {
        max-width: 420px;
        color: #9aa0ab;
        font-size: 0.95rem;
      }

      #loader.error .tire,
      #loader.error .loader-road,
      #loader.error .loader-dust i {
        animation-play-state: paused;
      }

      #loader.error .loader-text {
        color: #ff4d4d;
      }

      #loader.error .loader-text::after {
        content: none;
      }

      @keyframes tire-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes tire-bounce {
        from {
          bottom: 14px;
        }
        to {
          bottom: 17px;
        }
      }

      @keyframes road-scroll {
        to {
          background-position: -46px 0;
        }
      }

      @keyframes dust {
        from {
          opacity: 0.9;
          transform: translate(0, 0) scale(0.6);
        }
        to {
          opacity: 0;
          transform: translate(-70px, -22px) scale(2.2);
        }
      }

      @keyframes dots {
        0% {
          content: '';
        }
        25% {
          content: '.';
        }
        50% {
          content: '..';
        }
        75% {
          content: '...';
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .tire {
          animation-duration: 2.2s, 2.2s;
        }
        .loader-road {
          animation-duration: 1.7s;
        }
      }

      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="loader">
        <div class="loader-stage">
          <div class="loader-dust"><i></i><i></i><i></i></div>
          <svg class="tire" viewBox="-50 -50 100 100" width="112" height="112" aria-hidden="true">
            <circle r="46" class="tire-rubber" />
            <circle r="44" class="tire-tread" />
            <circle r="31" class="tire-wall" />
            <circle r="27" class="tire-rim" />
            <g class="tire-spokes"><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(0)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(72)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(144)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(216)" /><rect x="-3" y="-27" width="6" height="22" rx="2" transform="rotate(288)" /></g>
            <circle r="9" class="tire-hub" />
            <g class="tire-lugs"><circle cx="0" cy="-11" r="2.6" transform="rotate(36)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(108)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(180)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(252)" /><circle cx="0" cy="-11" r="2.6" transform="rotate(324)" /></g>
          </svg>
          <div class="loader-road"></div>
        </div>
        <div class="loader-text">Cargando motor de física…</div>
        <div class="loader-tip"></div>
      </div>

      <div id="storm-overlay"></div>
      <div id="damage-overlay"></div>
      <div id="flash-overlay"></div>

      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="hud-level">
            <div id="hud-level-name"></div>
            <div id="hud-objective"></div>
          </div>
          <div class="hud-timer">
            <div id="hud-timer-label">META</div>
            <div id="hud-timer">0 m</div>
            <div class="bar small"><div id="hud-progress-bar" class="fill"></div></div>
          </div>
          <div class="hud-score">
            <div id="hud-cash"></div>
            <div id="hud-score"></div>
            <div id="hud-wanted"></div>
          </div>
        </div>

        <div id="hud-ai" class="hud-ai hidden">
          <div class="hud-ai-title">EL ANALISTA</div>
          <div class="bar"><div id="hud-ai-bar" class="fill ai"></div></div>
          <div class="hud-ai-row"><span>Habilidad estimada</span><b id="hud-ai-skill">—</b></div>
          <div class="hud-ai-row"><span>Perfil</span><b id="hud-ai-tier">Calibrando…</b></div>
        </div>
        <div id="hud-storm" class="hidden"></div>

        <div id="hud-toasts"></div>
        <div id="hud-countdown" class="hidden"></div>
        <div id="hud-players"></div>

        <!-- Caído o capturado en cooperativo: solo la cuenta regresiva para reaparecer. -->
        <div id="hud-spectate">
          <div class="spec-title"></div>
          <div class="spec-label">Reapareces en</div>
          <div class="spec-count"></div>
          <div class="spec-dist"></div>
        </div>
      </div>

      <div id="screen" class="screen hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
